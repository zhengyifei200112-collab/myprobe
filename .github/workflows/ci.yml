name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=moderate
          npm --prefix web test
          npm --prefix web run build
          git diff --exit-code -- internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Test and vet
        run: |
          export MYPROBE_HTTP_TEST_DIR="$RUNNER_TEMP/myprobe-test-fixtures/http"
          export MYPROBE_NETWORK_TEST_DIR="$RUNNER_TEMP/myprobe-test-fixtures/network"
          printf 'MYPROBE_HTTP_TEST_DIR=%s\nMYPROBE_NETWORK_TEST_DIR=%s\n' "$MYPROBE_HTTP_TEST_DIR" "$MYPROBE_NETWORK_TEST_DIR" >> "$GITHUB_ENV"
          mkdir -p "$MYPROBE_HTTP_TEST_DIR" "$MYPROBE_NETWORK_TEST_DIR"
          go test ./...
          go vet ./...
          go build ./cmd/...
          go test -race ./internal/store ./internal/scheduler ./internal/agentgateway -run '^TestNetwork' -count=1
          go test -race ./internal/httpapi -run '^TestNetworkQuality' -count=1
          go test -race ./internal/networkquality -count=1
          go test -race ./internal/protocol/networkcheck -count=1
          go test -race ./internal/agentclient -run '^TestNetworkProbe' -count=1
          go test -race ./internal/agentclient -run '^TestNetwork(Delivery|ResultDelivery)' -count=1
          go test -race ./internal/agentclient ./internal/agentgateway ./internal/store ./internal/alerts -run '^Test(ActualAgentContact|Heartbeat|AgentContact|AgentHello|HTTPHello|PublicFreshness|OfflineUsesContact)' -count=1
          python3 scripts/native-network-evidence-test.py
          go test -race ./internal/diagnostics -count=1
          go test -race ./internal/releasecheck -count=1
          go test -race ./internal/store ./internal/httpapi -run 'History|Traffic|Covering|CanceledQuery|Subsecond|CapturedSort' -count=1
          go test -race ./internal/store -run '^Test(WriterReservation|ReportSurvivesWriterBusyTimeout)' -count=1
          go test -race ./internal/store -run '^TestRetentionSurvivesWriterBusyTimeout$' -count=1
          go test -race ./internal/httpapi -run '^TestReleaseStatusAdminContract$' -count=1
          go test -race ./internal/store ./internal/httpapi ./internal/agentgateway -run 'Diagnostic|Export' -count=1
          go test -race ./internal/backup -count=1
          go test -race ./internal/store ./internal/alerts ./internal/httpapi -run '^Test(ScheduledBackup|SystemNotification|IdleSystem)' -count=1

          go test -race ./internal/agentclient -run '^Test(Sampling|ReportPeriod|LegacySampling|HTTPFallback|ActualAgent|InvalidManaged|CollectionInterval|ReportingUses|WelcomeApplies)' -count=1
          go test -race ./internal/agentgateway ./internal/store ./internal/protocol/v2 -run '^Test(Sampling|ReportIngress|NegotiatedSampling|Configuration)' -count=1
          go test -race ./cmd/server -run '^Test(NetworkRetention|Retention)' -count=1

      - name: Verify released database upgrade
        env:
          MYPROBE_TEST_RELEASE_UPGRADE: '1'
        run: |
          git fetch --no-tags --depth=1 origin 532352963ab47aed4af730c400f25163d0e6ed45
          go test ./internal/store -run '^TestReleased021SchemaUpgradeToPolicies$' -count=1 -v
          MYPROBE_TEST_RELEASE_AGENT=1 go test ./internal/agentgateway -run '^TestNetworkReleasedAgentCompatibility$' -count=1 -v

      - name: Verify backups on an exhausted filesystem
        shell: bash
        run: |
          go test -c ./internal/backup -o "${RUNNER_TEMP}/myprobe-backup-linux.test"
          sudo sh scripts/run-backup-enospc.sh "${RUNNER_TEMP}/myprobe-backup-linux.test"

      - name: Verify published Agent compatibility
        shell: bash
        run: |
          set -euo pipefail
          released_agent="${RUNNER_TEMP}/myprobe-agent-v0.2.1-linux-amd64"
          curl --fail --location --retry 3 --output "$released_agent" https://github.com/zhengyifei200112-collab/myprobe/releases/download/v0.2.1/myprobe-agent-linux-amd64
          printf '%s  %s\n' '006fc5b316d3168ed22b1578bdc37012c1b13b82bab740116824ffc71b43b8dc' "$released_agent" | sha256sum --check --strict
          chmod 700 "$released_agent"
          MYPROBE_TEST_RELEASED_AGENT="$released_agent" go test ./internal/agentclient -run '^TestReleased021AgentRuntimeCompatibility$' -count=1 -v

      - name: Build and validate container images
        shell: bash
        run: |
          set -euo pipefail
          docker build --target server --build-arg VERSION=ci --tag myprobe-server:ci .
          docker build --target agent --build-arg VERSION=ci --tag myprobe-agent:ci .
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' myprobe-server:ci)" = '["/usr/local/bin/myprobe-server"]'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' myprobe-agent:ci)" = '["/usr/local/bin/myprobe-agent"]'
          test "$(docker image inspect --format '{{json .Config.Healthcheck}}' myprobe-agent:ci)" = 'null'
          docker run --rm myprobe-agent:ci --help >/dev/null
          docker run --rm --entrypoint ping myprobe-agent:ci -V >/dev/null
          MYPROBE_ADMIN_PASSWORD=test-password MYPROBE_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef docker compose config --quiet
          MYPROBE_SERVER=https://status.example.com MYPROBE_TOKEN=test-token docker compose -f compose.agent.yaml config --quiet

      - name: Validate installer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n install.sh scripts/install_test.sh
          shellcheck install.sh scripts/install_test.sh
          sh -n scripts/run-backup-enospc.sh
          shellcheck scripts/run-backup-enospc.sh
          sh -n scripts/run-network-evidence-loss.sh
          shellcheck scripts/run-network-evidence-loss.sh
          bash scripts/install_test.sh
          bash install.sh --help >/dev/null

      - name: Preserve failed regression fixtures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-regression-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/myprobe-test-fixtures
          if-no-files-found: ignore
          retention-days: 30

  network-comparison-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build exact embedded frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Install pinned browser fixture runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/myprobe-browsers
        run: |
          npm install --prefix "${RUNNER_TEMP}/myprobe-browser" --no-save playwright@1.62.1
          node "${RUNNER_TEMP}/myprobe-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium

      - name: Verify real scoped comparison and six theme and viewport flows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/myprobe-browser/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/myprobe-browsers
          MYPROBE_TEST_NETWORK_QUALITY_BROWSER: '1'
          MYPROBE_TEST_DIAGNOSTIC_EXPORT: '1'
          MYPROBE_TEST_RELEASE_BROWSER: '1'
          MYPROBE_TEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_ARTIFACT_DIR: ${{ runner.temp }}/myprobe-network-comparison
        run: |
          export MYPROBE_HTTP_TEST_DIR="${RUNNER_TEMP}/myprobe-test-fixtures/http"
          mkdir -p "$MYPROBE_HTTP_TEST_DIR"
          go test ./internal/httpapi -run '^TestNetwork(QualityLiveComparison|DefinitionLive)Browser$' -timeout 8m -count=1 -v
          go test ./cmd/server -run '^TestLiveDiagnosticExportMainBrowser$' -timeout 4m -count=1 -v
          go test ./internal/httpapi -run '^TestReleaseAwarenessLiveBrowser$' -timeout 4m -count=1 -v

      - name: Preserve synthetic comparison screenshots and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/myprobe-network-comparison
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve failed comparison database fixtures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-comparison-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/myprobe-test-fixtures
          if-no-files-found: ignore
          retention-days: 30

  network-probe-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Prepare bounded native ICMP fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes iputils-ping iproute2
          ping -V
      - name: Verify actual IPv4 and IPv6 TCP and ICMP
        env:
          MYPROBE_TEST_NETWORK_EVIDENCE_NATIVE: '1'
          MYPROBE_HTTP_TEST_DIR: ${{ runner.temp }}/myprobe-native-fixtures/http
          MYPROBE_NETWORK_TEST_DIR: ${{ runner.temp }}/myprobe-native-fixtures/network
        run: |
          mkdir -p "$MYPROBE_HTTP_TEST_DIR" "$MYPROBE_NETWORK_TEST_DIR"
          go test ./internal/agentclient -run '^TestNetworkProbe' -count=1 -timeout 2m -v
      - name: Verify actual transmitted packets with replies silenced in owned namespace
        run: |
          go test -c ./internal/agentclient -o "${RUNNER_TEMP}/myprobe-network-evidence.test"
          sudo sh scripts/run-network-evidence-loss.sh "${RUNNER_TEMP}/myprobe-network-evidence.test"

      - name: Preserve failed native database fixtures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-native-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/myprobe-native-fixtures
          if-no-files-found: ignore
          retention-days: 30

  network-probe-darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out exact native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up native Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify native loopback execution and durable receipt
        env:
          MYPROBE_TEST_NETWORK_EVIDENCE_NATIVE: '1'
          MYPROBE_HTTP_TEST_DIR: ${{ runner.temp }}/darwin-network/fixtures/http
          MYPROBE_NETWORK_TEST_DIR: ${{ runner.temp }}/darwin-network/fixtures/network
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/darwin-network" "$MYPROBE_HTTP_TEST_DIR" "$MYPROBE_NETWORK_TEST_DIR"
          python3 scripts/native-network-evidence-test.py
          go test ./internal/agentclient -run '^TestNetworkProbe' -count=1 -timeout 2m -json | tee "${RUNNER_TEMP}/darwin-network/events.jsonl"
          python3 scripts/native-network-evidence.py "${RUNNER_TEMP}/darwin-network/events.jsonl" "${RUNNER_TEMP}/darwin-network/result.json" --source "$EXPECTED_SOURCE" --arch '${{ matrix.arch }}'
          go test -race ./internal/agentclient -run '^TestNetworkProbe' -count=1 -timeout 3m
      - name: Preserve synthetic native events and source-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-network-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/darwin-network
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve failed Darwin database fixtures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-darwin-fixtures-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/darwin-network/fixtures
          if-no-files-found: ignore
          retention-days: 30
