name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/...
          go test -race ./internal/agentclient -run '^TestJointResource' -count=1
          go test -race ./internal/store ./internal/scheduler ./internal/agentgateway -run '^TestNetwork' -count=1
          go test -race ./internal/httpapi -run '^TestNetworkQuality' -count=1
          go test -race ./internal/networkquality -count=1
          go test -race ./internal/protocol/networkcheck -count=1
          go test -race ./internal/agentclient -run '^TestNetworkProbe' -count=1
          go test -race ./cmd/server -run '^TestNetworkRetention' -count=1

      - name: Verify released database upgrade
        env:
          MYPROBE_TEST_RELEASE_UPGRADE: '1'
        run: |
          git fetch --no-tags --depth=1 origin 532352963ab47aed4af730c400f25163d0e6ed45
          go test ./internal/store -run '^TestReleased021SchemaUpgradeToPolicies$' -count=1 -v

      - name: Verify backups on an exhausted filesystem
        shell: bash
        run: |
          go test -c ./internal/backup -o "${RUNNER_TEMP}/myprobe-backup-linux.test"
          sudo sh scripts/run-backup-enospc.sh "${RUNNER_TEMP}/myprobe-backup-linux.test"

      - name: Verify dense history retention and report writes
        env:
          MYPROBE_TEST_HISTORY_CAPACITY: '1'
          MYPROBE_TEST_HISTORY_NODES: '5'
          MYPROBE_TEST_HISTORY_VARIANT: full
        run: go test ./internal/store -run '^TestHistoryRetentionDenseCapacity$' -timeout 10m -count=1 -v

      - name: Verify published Agent compatibility
        shell: bash
        run: |
          set -euo pipefail
          released_agent="${RUNNER_TEMP}/myprobe-agent-v0.2.1-linux-amd64"
          curl --fail --location --retry 3 --output "$released_agent" https://github.com/zhengyifei200112-collab/myprobe/releases/download/v0.2.1/myprobe-agent-linux-amd64
          printf '%s  %s\n' '006fc5b316d3168ed22b1578bdc37012c1b13b82bab740116824ffc71b43b8dc' "$released_agent" | sha256sum --check --strict
          chmod 700 "$released_agent"
          MYPROBE_TEST_RELEASED_AGENT="$released_agent" go test ./internal/agentclient -run '^TestReleased021AgentRuntimeCompatibility$' -count=1 -v

      - name: Verify permanent service replay capacity and restore
        env:
          MYPROBE_TEST_SERVICE_REPLAY_CAPACITY: '1'
        run: go test ./internal/store -run '^TestServiceAlertPermanentReplayCapacity$' -timeout 10m -count=1 -v

      - name: Verify joint Server and Agent runtime with isolated notification receiver
        shell: bash
        run: |
          go build -o "${RUNNER_TEMP}/myprobe-joint-server" ./cmd/server
          go test -c ./internal/agentclient -o "${RUNNER_TEMP}/myprobe-joint-agentclient.test"
          sudo env MYPROBE_TEST_LOAD_RECONCILE=1 MYPROBE_TEST_LOAD_HISTORY=year MYPROBE_TEST_LOAD_TIMEOUT=10m sh scripts/run-joint-load.sh "${RUNNER_TEMP}/myprobe-joint-agentclient.test" "${RUNNER_TEMP}/myprobe-joint-server"

      - name: Build and validate container images
        shell: bash
        run: |
          set -euo pipefail
          docker build --target server --build-arg VERSION=ci --tag myprobe-server:ci .
          docker build --target agent --build-arg VERSION=ci --tag myprobe-agent:ci .
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' myprobe-server:ci)" = '["/usr/local/bin/myprobe-server"]'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' myprobe-agent:ci)" = '["/usr/local/bin/myprobe-agent"]'
          test "$(docker image inspect --format '{{json .Config.Healthcheck}}' myprobe-agent:ci)" = 'null'
          docker run --rm myprobe-agent:ci --help >/dev/null
          docker run --rm --entrypoint ping myprobe-agent:ci -V >/dev/null
          MYPROBE_ADMIN_PASSWORD=test-password MYPROBE_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef docker compose config --quiet
          MYPROBE_SERVER=https://status.example.com MYPROBE_TOKEN=test-token docker compose -f compose.agent.yaml config --quiet

      - name: Validate installer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n install.sh scripts/install_test.sh
          shellcheck install.sh scripts/install_test.sh
          sh -n scripts/run-backup-enospc.sh
          shellcheck scripts/run-backup-enospc.sh
          sh -n scripts/run-joint-load.sh
          shellcheck scripts/run-joint-load.sh
          sh -n scripts/run-network-evidence-loss.sh
          shellcheck scripts/run-network-evidence-loss.sh
          bash scripts/install_test.sh
          bash install.sh --help >/dev/null

  network-probe-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Prepare bounded native ICMP fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes iputils-ping iproute2
          ping -V
      - name: Verify actual IPv4 and IPv6 TCP and ICMP
        env:
          MYPROBE_TEST_NETWORK_EVIDENCE_NATIVE: '1'
        run: go test ./internal/agentclient -run '^TestNetworkProbe' -count=1 -timeout 2m -v
      - name: Verify actual transmitted packets with replies silenced in owned namespace
        run: |
          go test -c ./internal/agentclient -o "${RUNNER_TEMP}/myprobe-network-evidence.test"
          sudo sh scripts/run-network-evidence-loss.sh "${RUNNER_TEMP}/myprobe-network-evidence.test"

  network-archive-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Verify year network archive, paced current writes and staged restore
        env:
          MYPROBE_TEST_NETWORK_ARCHIVE_CAPACITY: '1'
          MYPROBE_TEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          MYPROBE_TEST_NETWORK_ARCHIVE_OUTPUT: ${{ runner.temp }}/network-archive-capacity.json
        run: go test ./internal/store -run '^TestNetworkQualityArchiveYearCapacity$' -timeout 12m -count=1 -v

  network-comparison-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build exact embedded frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Install pinned browser fixture runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/myprobe-browsers
        run: |
          npm install --prefix "${RUNNER_TEMP}/myprobe-browser" --no-save playwright@1.62.1
          node "${RUNNER_TEMP}/myprobe-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium

      - name: Verify real scoped comparison and six theme and viewport flows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/myprobe-browser/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/myprobe-browsers
          MYPROBE_TEST_NETWORK_QUALITY_BROWSER: '1'
          MYPROBE_TEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_ARTIFACT_DIR: ${{ runner.temp }}/myprobe-network-comparison
        run: go test ./internal/httpapi -run '^TestNetwork(QualityLiveComparison|DefinitionLive)Browser$' -timeout 8m -count=1 -v

      - name: Preserve synthetic comparison screenshots and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/myprobe-network-comparison
          if-no-files-found: ignore
          retention-days: 7
