server {
    listen 80;
    server_name probe.20011008.xyz;

    include /etc/nginx/snippets/myprobe-cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Match the host's existing listen options; migrate every TLS vhost to
    # `listen 443 ssl; http2 on;` together when its Nginx baseline is updated.
    listen 443 ssl http2;
    server_name probe.20011008.xyz;

    include /etc/nginx/snippets/myprobe-cloudflare-real-ip.conf;

    ssl_certificate /etc/letsencrypt/live/probe.20011008.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probe.20011008.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MYPROBE_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:25775;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
