# Temporary HTTP-only site used to obtain the first Let's Encrypt certificate.
# Replace it with myprobe.conf after certificate issuance.
server {
    listen 80;
    server_name probe.20011008.xyz;

    include /etc/nginx/snippets/myprobe-cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
